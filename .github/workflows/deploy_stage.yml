name: AIO App Stage

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Revalidate main with Stage credentials
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: YAML validation and secret scan
        run: |
          node scripts/ci-verify.mjs yaml
          node scripts/ci-verify.mjs secrets
      - name: Unit tests
        run: npm test
      - name: Generate and verify App Management artifacts
        run: |
          npx aio-commerce-lib-app generate all
          node scripts/ci-verify.mjs generated
          git diff --exit-code -- app.commerce.manifest.json src/commerce-extensibility-1/.generated src/commerce-configuration-1/.generated
      - name: Setup Adobe CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 11.x.x
      - name: Adobe OAuth Server-to-Server (Stage)
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ubuntu-latest
          command: oauth_sts
          CLIENTID: ${{ secrets.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          TECHNICALACCOUNTID: ${{ secrets.TECHNICALACCID }}
          TECHNICALACCOUNTEMAIL: ${{ secrets.TECHNICALACCEMAIL }}
          IMSORGID: ${{ secrets.IMSORGID }}
          SCOPES: ${{ secrets.SCOPES }}
      - name: Adobe Stage aio app test
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ubuntu-latest
          command: test
      - name: Adobe Stage aio app build
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ubuntu-latest
          command: build

  deploy:
    name: Review and deploy to Stage
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: stage-deploy
    concurrency:
      group: aio-workspace-stage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Verify reviewed source and generated artifacts
        run: |
          node scripts/ci-verify.mjs yaml
          node scripts/ci-verify.mjs secrets
          npm test
          npx aio-commerce-lib-app generate all
          node scripts/ci-verify.mjs generated
          git diff --exit-code -- app.commerce.manifest.json src/commerce-extensibility-1/.generated src/commerce-configuration-1/.generated
      - name: Setup Adobe CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 11.x.x
      - name: Adobe OAuth Server-to-Server (Stage)
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ubuntu-latest
          command: oauth_sts
          CLIENTID: ${{ secrets.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          TECHNICALACCOUNTID: ${{ secrets.TECHNICALACCID }}
          TECHNICALACCOUNTEMAIL: ${{ secrets.TECHNICALACCEMAIL }}
          IMSORGID: ${{ secrets.IMSORGID }}
          SCOPES: ${{ secrets.SCOPES }}
      - name: Adobe Stage build
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ubuntu-latest
          command: build
      - name: Adobe Stage deploy
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
          AIO_PROJECT_ID: ${{ secrets.AIO_PROJECT_ID }}
          AIO_PROJECT_NAME: ${{ secrets.AIO_PROJECT_NAME }}
          AIO_PROJECT_ORG_ID: ${{ secrets.AIO_PROJECT_ORG_ID }}
          AIO_PROJECT_WORKSPACE_ID: ${{ secrets.AIO_PROJECT_WORKSPACE_ID }}
          AIO_PROJECT_WORKSPACE_NAME: ${{ secrets.AIO_PROJECT_WORKSPACE_NAME }}
          AIO_PROJECT_WORKSPACE_DETAILS_SERVICES: ${{ secrets.AIO_PROJECT_WORKSPACE_DETAILS_SERVICES }}
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ubuntu-latest
          command: deploy
          noPublish: true
      - name: Assemble Stage release evidence after successful deployment
        run: node scripts/ci-evidence.mjs create
      - name: Retain sanitized release evidence only
        uses: actions/upload-artifact@v4
        with:
          name: stage-release-evidence
          path: release-evidence/stage.json
          if-no-files-found: error
          retention-days: 90
