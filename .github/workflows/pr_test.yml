name: AIO App PR CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  fork-checks:
    name: Fork / credential-free checks
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout untrusted PR merge commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: YAML validation
        run: node scripts/ci-verify.mjs yaml
      - name: Credential-free secret scan
        run: node scripts/ci-verify.mjs secrets
      - name: Unit tests
        run: npm test
      - name: Generate App Management artifacts
        run: npx aio-commerce-lib-app generate all
      - name: Check source against generated artifacts
        run: |
          node scripts/ci-verify.mjs generated
          git diff --exit-code -- app.commerce.manifest.json src/commerce-extensibility-1/.generated src/commerce-configuration-1/.generated
      - name: Setup Adobe CLI for syntax build only
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 11.x.x
      - name: Build without workspace credentials
        env:
          AIO_RUNTIME_NAMESPACE: ci-untrusted
        run: aio app build

  trusted-checks:
    name: Trusted branch / Stage verification
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - name: Checkout trusted PR merge commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: YAML validation
        run: node scripts/ci-verify.mjs yaml
      - name: Secret scan
        run: node scripts/ci-verify.mjs secrets
      - name: Unit tests
        run: npm test
      - name: Generate App Management artifacts
        run: npx aio-commerce-lib-app generate all
      - name: Check source against generated artifacts
        run: |
          node scripts/ci-verify.mjs generated
          git diff --exit-code -- app.commerce.manifest.json src/commerce-extensibility-1/.generated src/commerce-configuration-1/.generated
      - name: Setup Adobe CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 11.x.x
      - name: Adobe OAuth Server-to-Server (Stage)
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ubuntu-latest
          command: oauth_sts
          CLIENTID: ${{ secrets.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          TECHNICALACCOUNTID: ${{ secrets.TECHNICALACCID }}
          TECHNICALACCOUNTEMAIL: ${{ secrets.TECHNICALACCEMAIL }}
          IMSORGID: ${{ secrets.IMSORGID }}
          SCOPES: ${{ secrets.SCOPES }}
      - name: Adobe Stage aio app test
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ubuntu-latest
          command: test
      - name: Adobe Stage aio app build
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ubuntu-latest
          command: build
